<!doctype html>
<html cwv-control-mode="cursor">
<head>
  <title>Cursor Page Mode</title>
  <style>
    .tap-card {
      display: inline-block;
      padding: 10px;
      margin: 6px;
      border: 2px solid #777;
      background: #eeeeee;
      color: #111111;
    }
    .tap-card:active {
      background: #355f9b;
      color: #ffffff;
      border-color: #9fc5ff;
    }
  </style>
</head>
<body>
  <h1>Cursor Page Mode</h1>
  <p>The pad is the mouse: left stick and D-pad move the pointer cursor, Cross taps, Circle goes back.</p>
  <a href="basic.html" class="tap-card">A tap card link</a>
  <button class="tap-card">A tap card button</button>
  <button class="tap-card">Another card</button>
</body>
</html>
