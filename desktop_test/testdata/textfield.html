<!doctype html>
<html cwv-control-mode="browser">
<head>
<meta charset="utf-8">
<title>CWebView Textfield</title>
<style>
html,body{margin:0;padding:0;font-family:sans-serif}body{padding:24px}h1{margin-top:0}.field{margin:12px 0}.hint{opacity:.7}.row{margin:14px 0}.field-input{display:block;width:380px;box-sizing:border-box;font-size:1em}.active{outline:2px solid #e0b83f}
</style>
</head>
<body>
<h1>Vita Textfield</h1>
<p class="hint">Tap a field or focus it with DPAD and press CROSS to open the PSVita keyboard.</p>
<div class="row"><label>Name</label><input type="text" class="field-input" id="name" placeholder="Type your name"></div>
<div class="row"><label>Value</label><input type="text" class="field-input" id="value" value="Initial value"></div>
<div class="row"><label>Password</label><input type="password" id="password" placeholder="Password"></div>
<p>VCM controls can still be used independently of textfields.</p>
</body>
</html>
