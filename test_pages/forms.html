<!doctype html>
<html><head><style>
body { background:#eeeeee; color:#111; }
.box { width:300px; height:70px; padding:8px; margin:10px; border:3px dashed #cc5500; }
.solid { border:2px solid #0066aa; }
.dotted { border:2px dotted #228844; }
.double { border:5px double #662288; }
select { text-align:center; }
</style></head><body>
<h1>Forms / CSS Test</h1>
<div class="box">Dashed border</div>
<div class="box solid">Solid border</div>
<div class="box dotted">Dotted border</div>
<div class="box double">Double border</div>
<select style="width:220px;height:42px;background:#ffffff;color:#111111;border:2px solid #555555;padding:6px"><option>First option</option><option selected>Selected option</option><option>Third option</option></select>
<button>Button beside select</button>
</body></html>
